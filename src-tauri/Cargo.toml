[package]
name = "Meno"
version = "0.1.17"
description = "Molecular Editor for Notation and Orbitals"
authors = ["Keisuke Fukaya"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
fontdb = "0.24"
ttf-parser = "0.25.1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tauri-plugin-updater = "2"
# Meno's folders found before Tauri is built, as Tauri finds them (src/folders.rs)
dirs = "7"
# Fetching the tools that make Python environments (src/tools.rs): the
# crates the updater already brings, with its TLS
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
png = "0.17"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }

# A job's program, and what it starts, stopped as a process group (src/jobs.rs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The system clipboard (src/clipboard.rs), by each platform's own API; and the
# window's keys given back to the page after a talk covers the screen (src/present.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.1", default-features = false, features = ["std", "NSApplication", "NSColor", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.1", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSString", "NSURL"] }
# (and src/defaults.rs: the block the system answers a change of default app with)
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# (and jobs.rs: a job's program, and what it starts, in a job object; savefile.rs:
# a saved file put in place over the old by ReplaceFileW)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }
# Structures as OLE objects in Office documents (src/ole.rs): the COM
# server's interfaces. The version the webview's crates already use.
windows-core = "0.61" # (what `#[implement]` expands to names it)
# One Meno: a workspace file opened while it runs comes to it (src/opened.rs)
tauri-plugin-single-instance = "2"
# A pinch the page takes for its own zoom (src/pinch.rs): WebView2's settings,
# in the versions the webview's crates already use
webview2-com = "0.39"
windows-core-62 = { package = "windows-core", version = "0.62" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
