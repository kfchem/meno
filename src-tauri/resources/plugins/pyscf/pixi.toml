# The PySCF plugin's environment, made by pixi from the lock beside this
# file - every package pinned by its hash - when the plugin is added in
# Settings, Plugins (docs/PLUGINS.md). PySCF and its
# libraries come from conda-forge, which has them for Windows too.
[workspace]
name = "meno-reader-pyscf"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = "3.12.*"
pyscf = "==2.14.0"
numpy = ">=1.26"
scipy = "*"
