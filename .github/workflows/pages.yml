name: Pages

# Meno's website (site/), published to GitHub Pages: when it changes on main,
# and when a release is published, so the page offers the new downloads.
# Pages must be set to deploy from GitHub Actions (Settings, Pages).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site/release.mjs"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # node's own modules only: nothing to install
      - run: node scripts/site/release.mjs site _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
