name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri build refuses to run when the Rust crates and npm packages
      # drift apart; dev only warns, so catch it here.
      - run: npm run check:tauri
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # A plugin's worker that needs Python alone is tested here; those that
      # need their packages, in the job "plugins" below.
      - run: python3 -m unittest scripts/calc/test_plugin_gaussian.py
      - run: python3 -m unittest scripts/calc/test_reader_gaussian.py
      - run: python3 -m unittest scripts/calc/test_plugin_orca.py
      - run: python3 -m unittest scripts/calc/test_plugin_xtb.py
      - run: python3 -m unittest scripts/calc/test_plugin_crest.py
      - run: python3 -m unittest scripts/calc/test_plugin_blender.py
      - run: python3 -m unittest scripts/calc/test_plugin_nci.py
      - run: python3 -m unittest scripts/calc/test_plugin_pictures.py
      - run: python3 -m unittest scripts/calc/test_plugin_wfx.py
      - run: python3 -m unittest scripts/calc/test_plugin_reinvent.py
      - run: python3 -m unittest scripts/calc/test_plugin_crem.py
      - run: python3 -m unittest scripts/calc/test_charge_multiplicity.py
      - run: python3 -m unittest scripts/calc/test_reader_pyscf_species.py

  frontend-windows:
    name: Frontend tests on Windows
    # Windows is the primary target, and some faults show only there: paths
    # written with backslashes, processor time counted in steps of ~15.6 ms.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  plugins:
    # The plugins' own tests that need their packages, each in its plugin's
    # environment installed from the plugin's lock - exactly the versions
    # the app sets up - so that a known answer they hold (the RDKit plugin's
    # ring chairs, its configurations) is checked on every push. A job of
    # its own: the package index being down fails this, not the build.
    name: Plugins (each in its locked environment)
    # (its locks are compiled for Python 3.12, this image's own)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: rdkit
            needs: rdkit
            tests: scripts/calc/test_plugin_rdkit.py scripts/chem/test_chem_worker.py
          # (its fragment database aside: 2 GB unpacked, its tests that need it skipped here)
          - plugin: crem
            needs: crem
            tests: scripts/calc/test_plugin_crem.py
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Its environment, from its lock
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/python" -m pip install --require-hashes --no-deps -r src-tauri/resources/plugins/${{ matrix.plugin }}/requirements.lock
      # (the package its tests need, there - so that they run, not skip)
      - run: '"$RUNNER_TEMP/env/bin/python" -c "import ${{ matrix.needs }}"'
      - run: '"$RUNNER_TEMP/env/bin/python" -m unittest ${{ matrix.tests }}'

  rust:
    name: Rust backend (check, clippy, test)
    # Windows: the bundled uv binary and the primary target are Windows, and
    # the runner already has the MSVC toolchain and WebView2.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # tauri::generate_context! embeds ../dist, so build the frontend first.
      - run: npm ci
      - run: npm run build
      # PDFium's library, pinned (scripts/fetch-pdfium.mjs): the bundle names
      # it among Windows' resources, which the build looks for.
      - run: node scripts/fetch-pdfium.mjs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
