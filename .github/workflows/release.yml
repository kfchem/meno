name: Release

# A tag v* builds Meno and puts it on a draft GitHub Release, with the
# update it becomes for the Meno already installed (signed with the
# updater's key) and latest.json, which those Menos look for - for Windows,
# then for the Mac. Nothing reaches anyone until the maintainer publishes
# the draft. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (NSIS installer and update)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PDFium's library, pinned and checked (scripts/fetch-pdfium.mjs), carried in the app
      - run: node scripts/fetch-pdfium.mjs
      - run: npm run check:tauri
      - name: The tag is the version
        shell: bash
        run: |
          app="v$(node -p "require('./package.json').version")"
          crate="v$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)"
          echo "tag ${{ github.ref_name }}, package.json $app, Cargo.toml $crate"
          test "$app" = "${{ github.ref_name }}" && test "$crate" = "${{ github.ref_name }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the updater's signing key, kept by the maintainer (docs/RELEASING.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meno ${{ github.ref_name }}
          releaseBody: See the commits since the last release.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config {"bundle":{"createUpdaterArtifacts":true}}
      # An installed Meno takes an update only when its signature names the
      # version it is announced as (requireSignedVersion), which the Tauri
      # CLI writes from 2.12 on. The draft of a run that fails here must not
      # be published (docs/RELEASING.md).
      - name: The update is signed for this version
        shell: bash
        run: |
          sig="src-tauri/target/release/bundle/nsis/Meno_${GITHUB_REF_NAME#v}_x64-setup.exe.sig"
          comment=$(base64 -d "$sig" | tr -d '\r' | grep '^trusted comment: ')
          echo "$sig: $comment"
          echo "${comment#trusted comment: }" | tr '\t' '\n' | grep -qx "version:${GITHUB_REF_NAME#v}"

  macos:
    name: macOS (app, disk image and update)
    # After Windows: each job reads the draft's latest.json, adds its own
    # platforms and puts it back whole, and finds the draft the other made -
    # so one at a time, or one could undo the other.
    needs: windows
    # (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PDFium's library, pinned and checked (scripts/fetch-pdfium.mjs), carried in the app
      - run: node scripts/fetch-pdfium.mjs
      - run: npm run check:tauri
      - name: The tag is the version
        run: |
          app="v$(node -p "require('./package.json').version")"
          crate="v$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)"
          echo "tag ${{ github.ref_name }}, package.json $app, Cargo.toml $crate"
          test "$app" = "${{ github.ref_name }}" && test "$crate" = "${{ github.ref_name }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meno ${{ github.ref_name }}
          releaseBody: See the commits since the last release.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Signed ad hoc (signingIdentity "-"), the whole bundle: not with
          # Apple's Developer ID, which is not taken up yet - macOS asks once
          # before opening Meno. Left with only the linker's signature on its
          # executable, the bundle would be refused as damaged instead, with
          # no way to open it. See docs/RELEASING.md, The Mac.
          args: --bundles app,dmg --config {"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}
      # (the same check as Windows'; macOS's base64 takes the file on stdin)
      - name: The update is signed for this version
        run: |
          sig="src-tauri/target/release/bundle/macos/Meno.app.tar.gz.sig"
          comment=$(base64 -d < "$sig" | tr -d '\r' | grep '^trusted comment: ')
          echo "$sig: $comment"
          echo "${comment#trusted comment: }" | tr '\t' '\n' | grep -qx "version:${GITHUB_REF_NAME#v}"
